services:
  postgres:
    image: postgres:16-alpine
    container_name: stackvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stackvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stackvault_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-stackvault}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - stackvault_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-stackvault} -d ${POSTGRES_DB:-stackvault}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  stackvault_postgres_data:
